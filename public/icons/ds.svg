<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Flaticon Flat Color Line-Art: Nintendo DS (Exact replica from Flaticon screenshot) -->
  <g stroke="#1F2937" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer Body -->
    <rect x="28" y="20" width="72" height="88" rx="8" fill="#7DD3FC" />
    
    <!-- Top Screen Frame -->
    <rect x="36" y="28" width="56" height="32" rx="3" fill="#374151" />
    <rect x="40" y="32" width="48" height="24" fill="#BAE6FD" />
    
    <!-- Hinge Bar -->
    <line x1="28" y1="64" x2="100" y2="64" stroke="#1F2937" stroke-width="3" />
    
    <!-- Bottom Screen Frame -->
    <rect x="40" y="70" width="48" height="30" rx="3" fill="#374151" />
    <rect x="44" y="74" width="40" height="22" fill="#E0F2FE" />
    
    <!-- D-Pad Left -->
    <path d="M 31 78 h 3 v -3 h 3 v 3 h 3 v 3 h -3 v 3 h -3 v -3 h -3 Z" fill="#1F2937" />
    
    <!-- Action Buttons Right -->
    <circle cx="94" cy="77" r="1.5" fill="#EF4444" stroke="none" />
    <circle cx="97" cy="80" r="1.5" fill="#F59E0B" stroke="none" />
    <circle cx="91" cy="80" r="1.5" fill="#10B981" stroke="none" />
    <circle cx="94" cy="83" r="1.5" fill="#3B82F6" stroke="none" />
  </g>
</svg>
