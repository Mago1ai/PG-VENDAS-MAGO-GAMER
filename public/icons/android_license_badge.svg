<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="cyberBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#050508" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff88" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Background rounded badge -->
  <rect width="512" height="512" rx="90" fill="url(#cyberBg)" stroke="rgba(0, 255, 136, 0.4)" stroke-width="8"/>

  <!-- Shield Shape / Badge -->
  <path d="M 256 60 L 400 115 V 250 C 400 350 256 430 256 430 C 256 430 112 350 112 250 V 115 Z" 
        fill="#090d16" 
        stroke="url(#neonGreen)" 
        stroke-width="7" />

  <!-- Inner Android Robot Silhouette / Head -->
  <g transform="translate(166, 115) scale(0.35)">
    <!-- Android Antennas -->
    <line x1="160" y1="130" x2="100" y2="40" stroke="#00ff88" stroke-width="28" stroke-linecap="round"/>
    <line x1="352" y1="130" x2="412" y2="40" stroke="#00ff88" stroke-width="28" stroke-linecap="round"/>
    
    <!-- Android Head Dome -->
    <path d="M 64 210 A 192 192 0 0 1 448 210 Z" fill="url(#neonGreen)"/>
    
    <!-- Eyes -->
    <circle cx="170" cy="140" r="22" fill="#050508"/>
    <circle cx="342" cy="140" r="22" fill="#050508"/>
    
    <!-- Body -->
    <rect x="64" y="235" width="384" height="240" rx="30" fill="url(#neonGreen)"/>
  </g>

  <!-- Golden Key Icon overlay -->
  <g transform="translate(200, 260) scale(1.8)">
    <circle cx="36" cy="22" r="14" fill="none" stroke="#ffea00" stroke-width="5" />
    <circle cx="36" cy="22" r="6" fill="#ffea00" />
    <rect x="12" y="19" width="18" height="6" rx="2" fill="#ffea00" />
    <rect x="18" y="25" width="5" height="8" rx="1" fill="#ffea00" />
    <rect x="25" y="25" width="5" height="6" rx="1" fill="#ffea00" />
  </g>

  <!-- VIP / LICENSE TEXT BADGE -->
  <rect x="136" y="400" width="240" height="46" rx="12" fill="#00ff88" />
  <text x="256" y="431" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="20" fill="#050508" text-anchor="middle" letter-spacing="3">VIP LICENSE</text>
</svg>
