<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Flaticon Flat Color Line-Art: Nintendo 64 Console -->
  <g stroke="#1F2937" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Curved Charcoal Body -->
    <path d="M 24 50 Q 64 38 104 50 L 100 88 Q 64 94 28 88 Z" fill="#374151" />
    <!-- Cartridge Slot Top -->
    <ellipse cx="64" cy="52" rx="20" ry="6" fill="#1F2937" />
    <!-- 4 Controller Front Ports -->
    <circle cx="38" cy="74" r="3" fill="#6B7280" />
    <circle cx="50" cy="74" r="3" fill="#6B7280" />
    <circle cx="78" cy="74" r="3" fill="#6B7280" />
    <circle cx="90" cy="74" r="3" fill="#6B7280" />
    <!-- Power & Reset Buttons -->
    <rect x="34" y="56" width="8" height="8" rx="1.5" fill="#EF4444" stroke="none" />
    <rect x="86" y="56" width="8" height="8" rx="1.5" fill="#3B82F6" stroke="none" />
    <!-- 3D N Logo Badge -->
    <rect x="60" y="70" width="8" height="8" rx="1" fill="#F59E0B" stroke="none" />
  </g>
</svg>
