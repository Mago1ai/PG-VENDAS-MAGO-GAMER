<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Flaticon Flat Color Line-Art: Arcade Cabinet -->
  <g stroke="#1F2937" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main Cabinet Silhouette -->
    <polygon points="34,104 38,24 90,24 94,104" fill="#E11D48" />
    <!-- Glowing Marquee Top -->
    <rect x="42" y="30" width="44" height="14" rx="2" fill="#FACC15" />
    <text x="64" y="41" font-family="sans-serif" font-size="8" font-weight="900" fill="#1F2937" text-anchor="middle" stroke="none">ARCADE</text>
    <!-- Screen Box -->
    <rect x="44" y="50" width="40" height="28" rx="3" fill="#1E293B" />
    <rect x="48" y="54" width="32" height="20" rx="1" fill="#38BDF8" />
    <!-- Joystick & Buttons Control Deck -->
    <polygon points="38,80 90,80 94,92 34,92" fill="#334155" />
    <!-- Joystick -->
    <line x1="48" y1="84" x2="48" y2="88" stroke="#1F2937" stroke-width="2" />
    <circle cx="48" cy="83" r="3" fill="#EF4444" stroke="none" />
    <!-- Action Buttons -->
    <circle cx="68" cy="86" r="2" fill="#FACC15" stroke="none" />
    <circle cx="75" cy="86" r="2" fill="#10B981" stroke="none" />
    <circle cx="82" cy="86" r="2" fill="#3B82F6" stroke="none" />
  </g>
</svg>
