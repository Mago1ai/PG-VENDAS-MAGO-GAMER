<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="zipBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="50%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#27272a" />
    </linearGradient>
    <linearGradient id="zipAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="90" fill="url(#zipBg)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="8"/>

  <!-- 7-Zip Box / Zipper Emblem -->
  <g transform="translate(96, 70)">
    <!-- Big Stylized '7z' Logo Shape -->
    <!-- Number 7 -->
    <path d="M 40 40 H 180 L 110 230 H 50 L 115 100 H 40 Z" fill="url(#zipAccent)" />
    
    <!-- Letter Z -->
    <path d="M 180 80 H 290 L 195 210 H 295 V 250 H 165 L 260 120 H 180 Z" fill="#ffffff" />

    <!-- Zipper Teeth Details -->
    <g transform="translate(10, 240)">
      <rect x="20" y="20" width="35" height="14" rx="4" fill="#38bdf8" opacity="0.8" />
      <rect x="70" y="30" width="35" height="14" rx="4" fill="#38bdf8" opacity="0.8" />
      <rect x="120" y="20" width="35" height="14" rx="4" fill="#38bdf8" opacity="0.8" />
      <rect x="170" y="30" width="35" height="14" rx="4" fill="#38bdf8" opacity="0.8" />
      <rect x="220" y="20" width="35" height="14" rx="4" fill="#38bdf8" opacity="0.8" />
      <line x1="0" y1="32" x2="300" y2="32" stroke="#38bdf8" stroke-width="4" stroke-dasharray="6,6" />
    </g>
  </g>

  <!-- Bottom Badge -->
  <rect x="136" y="400" width="240" height="46" rx="12" fill="#00ff88" />
  <text x="256" y="431" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="20" fill="#050508" text-anchor="middle" letter-spacing="2">7-ZIP WIN</text>
</svg>
